name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'influence-so/influence-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public connector metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned official publisher
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc \
            "$RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            --directory "$RUNNER_TEMP" mcp-publisher
      - name: Validate registry manifest
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'
      - name: Authenticate using GitHub OIDC
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish hosted endpoint metadata
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
